name: Test and deploy SMCC
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smcc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      - run: npm run test:browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      - run: docker compose config --quiet

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_CONTAINER_APP }}
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deployment configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          : "${RESOURCE_GROUP:?Set AZURE_RESOURCE_GROUP}"
          : "${APP_NAME:?Set AZURE_CONTAINER_APP}"
          : "${ACR_NAME:?Set AZURE_ACR_NAME}"
          : "${CLIENT_ID:?Set AZURE_CLIENT_ID}"
          : "${TENANT_ID:?Set AZURE_TENANT_ID}"
          : "${SUBSCRIPTION_ID:?Set AZURE_SUBSCRIPTION_ID}"
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push immutable image
        run: |
          az acr login --name "$ACR_NAME"
          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          IMAGE="$LOGIN_SERVER/smcc:${GITHUB_SHA}"
          docker build --platform linux/amd64 --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy a revision
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
            --image "$IMAGE" --set-env-vars "APP_REVISION=$GITHUB_SHA" \
            --revision-suffix "sha-${GITHUB_SHA:0:12}" --output none
      - name: Verify live revision
        run: |
          HOST=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          for attempt in $(seq 1 30); do
            if BODY=$(curl --fail --silent --show-error --max-time 20 "https://$HOST/healthz") &&
              echo "$BODY" | jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .service == "smcc" and .revision == $sha' > /dev/null; then
              curl --fail --silent --show-error --retry 3 "https://$HOST/" | grep -q '서울모닝커피클럽'
              curl --fail --silent --show-error --retry 3 "https://$HOST/readyz" | jq -e '.ready == true' > /dev/null
              echo "### Deployed https://$HOST" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The deployed revision did not become healthy"
          exit 1
      - name: Verify persistent service E2E
        run: |
          HOST=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          export TEST_BASE_URL="https://$HOST"
          cleanup() {
            if [ -f .mvp-verification.json ]; then
              TEST_PHASE=cleanup node scripts/verify-mvp.js
            fi
          }
          trap cleanup EXIT
          TEST_SCOPE=service node scripts/verify-mvp.js
          REVISION=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query properties.latestReadyRevisionName -o tsv)
          az containerapp revision restart --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --revision "$REVISION" --output none
          sleep 5
          READY=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 20 "$TEST_BASE_URL/readyz" | jq -e '.ready == true' > /dev/null; then
              READY=true
              break
            fi
            sleep 5
          done
          if [ "$READY" != true ]; then
            echo "::error::Service did not recover after the persistence-test restart"
            exit 1
          fi
          TEST_PHASE=verify node scripts/verify-mvp.js
          echo "### Persistent member/guest E2E and fixture cleanup passed" >> "$GITHUB_STEP_SUMMARY"
