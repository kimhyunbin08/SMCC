services:
  web:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      APP_MODE: local
      DB_PATH: /data/smcc.sqlite
      PUBLIC_ORIGIN: "http://localhost:${HOST_PORT:-3000}"
    volumes:
      - smcc-data:/data
    restart: unless-stopped

volumes:
  smcc-data:
